<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Da Palma a Palma — Manutenzione e abbattimento palme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --sand:#e2c89d;
    --forest:#1d4f2f;
    --ink:#111;
    --surface:#faf5e9;
  }

  *{ box-sizing:border-box; }

  html{
    height:100%;
  }

  body{
    margin:0;
    min-height:100svh;
    min-height:100vh;
    font-family:'Inter',Arial,sans-serif;
    color:var(--ink);
    background:var(--sand);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:48px 20px;
    position:relative;
    overflow-x:hidden;
  }

  .container{
    position:relative;
    z-index:1;
    width:100%;
    max-width:440px;
    text-align:center;
  }

  .logo{
    display:block;
    width:min(340px, 78vw);
    height:auto;
    margin:0 auto 28px;
  }

  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(30px, 6vw, 44px);
    line-height:1.15;
    color:var(--forest);
    margin:0 0 22px;
    letter-spacing:-0.01em;
  }

  .email{
    font-size:clamp(15px, 3.6vw, 17px);
    font-weight:500;
    color:var(--forest);
    margin-bottom:30px;
    word-break:break-word;
  }

  .actions{
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .btn{
    display:block;
    width:100%;
    padding:14px 20px;
    border-radius:10px;
    text-decoration:none;
    font-size:16px;
    font-weight:600;
    font-family:'Inter',Arial,sans-serif;
    transition:transform .15s ease, background-color .15s ease, border-color .15s ease;
  }

  .btn:focus-visible{
    outline:2px solid var(--forest-dark);
    outline-offset:2px;
  }

  .btn-outline{
    color:var(--forest);
    background:rgba(250,245,233,.55);
    border:1.5px solid var(--forest);
  }

  .btn-outline:hover{
    background:rgba(250,245,233,.85);
  }

  .btn-primary{
    color:#fff;
    background:#25D366;
    border:1.5px solid #1fb659;
    font-size:17px;
    padding:16px 20px;
  }

  .btn-primary:hover{
    background:#20bd5a;
  }

  .btn:active{
    transform:scale(.98);
  }

  @media (prefers-reduced-motion: reduce){
    .btn{ transition:none; }
  }

  @media (max-width:380px){
    body{ padding:36px 16px; }
    h1{ margin-bottom:18px; }
  }
</style>
</head>

<body>

<div class="container">

  <img class="logo" src="logo.png" alt="Da Palma a Palma">

  <h1>Manutenzione e<br>abbattimento palme</h1>

  <div class="email">info@dapalmaapalma.ch</div>

  <div class="actions">
    <a class="btn btn-outline" href="mailto:info@dapalmaapalma.ch">Scrivici via email</a>
    <a class="btn btn-outline" href="https://instagram.com/dapalmaapalma/" target="_blank" rel="noopener">Seguici su Instagram</a>
    <a class="btn btn-primary" href="https://wa.me/41765468541" target="_blank" rel="noopener">Scrivici su WhatsApp</a>
  </div>

</div>

</body>
</html>
