<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Da Palma a Palma</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100dvh;
    font-family: Arial, sans-serif;
    background: #e2c89d;
}

body {
    background-image: url("logo.png");
    background-repeat: no-repeat;
    background-position: center 30%;
    background-size: min(70%, 320px);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px 16px 40px;
}

.container {
    width: 100%;
    max-width: 420px;
    margin-top: min(15vh, 120px);
    text-align: center;
    z-index: 2;
}

h1 {
    font-size: clamp(22px, 6vw, 28px);
    color: #111;
    margin-bottom: 14px;
    line-height: 1.25;
}

.email {
    font-size: clamp(15px, 4vw, 18px);
    font-weight: bold;
    color: #1d4f2f;
    margin-bottom: 14px;
    word-break: break-word;
}

.btn {
    display: block;
    width: 100%;
    padding: 13px;
    margin-bottom: 16px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 17px;
    font-weight: bold;
    color: #1d4f2f;
    background: rgba(255,255,255,.5);
    border: 1px solid rgba(0,0,0,.15);
}

.whatsapp {
    display: inline-block;
    margin-top: 10px;
    padding: 14px 28px;
    border-radius: 8px;
    background: #25D366;
    color: #fff;
    text-decoration: none;
    font-weight: bold;
    font-size: 18px;
}

@media (max-width: 480px) {
    body {
        background-size: min(60%, 220px);
        background-position: center 22%;
    }

    .container {
        margin-top: 90px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>Manutenzione e<br>abbattimento palme</h1>

<div class="email">
info@dapalmaapalma.ch
</div>

<a class="btn" href="mailto:info@dapalmaapalma.ch">
Scrivici via email
</a>

<a class="btn" href="https://instagram.com/dapalmaapalma/" target="_blank">
Instagram
</a>

<a class="whatsapp" href="https://wa.me/41765468541" target="_blank">
WhatsApp
</a>

</div>

</body>
</html>
