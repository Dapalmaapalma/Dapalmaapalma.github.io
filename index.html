  /* Testo letto da Google e dai lettori vocali, non visibile */
  .visually-hidden{
    position:absolute;

    height:1px;
    margin:-1px;

    overflow:hidden;
    clip:rect(0,0,0,0);
    clip-path:inset(50%);

    border:0;
  }

  /* ---------- Copertina ---------- */
  .cover{
    position:relative;
    height:clamp(300px, 56svh, 600px);
    overflow:hidden;
    background:var(--sand);
  }
  .cover img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 40%;
    /* sfuma in alto (verso l'orologio del telefono) e in basso */
    -webkit-mask-image:linear-gradient(to bottom, transparent 0%, #000 22%, #000 62%, transparent 100%);
    mask-image:linear-gradient(to bottom, transparent 0%, #000 22%, #000 62%, transparent 100%);
  }

  .hero{
    position:relative;
    z-index:1;
    text-align:center;
    padding:0 0 56px;
  }

  .logo{

    height:auto;
    margin:48px auto 0;

    line-height:1.4;
    letter-spacing:.005em;
    max-width:26em;
    margin:0 auto 34px;
    padding-top:4px;
  }

  /* ---------- Pulsanti ---------- */
  .actions{
    display:flex;
    flex-direction:column;
    gap:16px;
    max-width:420px;
    margin:0 auto;
  }

  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    min-height:60px;
    padding:14px 22px;
    border:2px solid var(--ink);
    border-radius:16px;
    box-shadow:0 5px 0 var(--ink);
    text-decoration:none;
    font-size:18px;
    font-weight:600;
    line-height:1.2;
    color:var(--ink);
    transition:transform .12s ease, box-shadow .12s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn svg{
    width:26px;
    height:26px;
    flex:none;
    fill:none;
    stroke:currentColor;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .btn:hover{
    transform:translateY(2px);
    box-shadow:0 3px 0 var(--ink);
  }
  .btn:active{
    transform:translateY(5px);
    box-shadow:0 0 0 var(--ink);
  }
  .btn-wa{ background:var(--deep); color:#fff; }
  .btn-call{ background:var(--leaf); }
  .btn-mail{ background:var(--mint); }
  .btn-ig{ background:var(--cream); }
