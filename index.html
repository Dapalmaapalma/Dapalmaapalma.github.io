<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Da Palma a Palma</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: #e2c89d;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 16px 50px;
}

.logo {
    width: 100%;
    max-width: 260px;
    height: auto;
    margin-bottom: 20px;
}

.container {
    width: 100%;
    max-width: 420px;
    text-align: center;
}

h1 {
    font-size: 26px;
    color: #111;
    margin: 0 0 16px;
    line-height: 1.3;
}

.email {
    font-size: 17px;
    font-weight: bold;
    color: #1d4f2f;
    margin-bottom: 18px;
    word-break: break-word;
}

.btn {
    display: block;
    width: 100%;
    padding: 13px;
    margin-bottom: 14px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 17px;
    font-weight: bold;
    color: #1d4f2f;
    background: rgba(255,255,255,.6);
    border: 1px solid rgba(0,0,0,.15);
}

.whatsapp {
    display: inline-block;
    margin-top: 6px;
    padding: 14px 28px;
    border-radius: 8px;
    background: #25D366;
    color: #fff;
    text-decoration: none;
    font-weight: bold;
    font-size: 18px;
}

@media (max-width: 480px) {
    .logo {
        max-width: 180px;
    }

    h1 {
        font-size: 22px;
    }
}
</style>

</head>

<body>

<img class="logo" src="logo.png" alt="Da Palma a Palma">

<div class="container">

<h1>Manutenzione e<br>abbattimento palme</h1>

<div class="email">
info@dapalmaapalma.ch
</div>

<a class="btn" href="mailto:info@dapalmaapalma.ch">
Scrivici via email
</a>

<a class="btn" href="https://instagram.com/dapalmaapalma/" target="_blank">
Instagram
</a>

<a class="whatsapp" href="https://wa.me/41765468541" target="_blank">
WhatsApp
</a>

</div>

</body>
</html>
